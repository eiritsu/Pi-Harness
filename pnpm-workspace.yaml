packages:
  - protocol
  - kernel
  - host
  - ui
  - core/vendor/pi-mono/packages/*

allowBuilds:
  '@google/genai': set this to true or false
  canvas: set this to true or false
  esbuild: set this to true or false
  protobufjs: set this to true or false

onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - canvas
  - '@google/genai'
